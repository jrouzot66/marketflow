services:
  web:
    image: nginx:1.27-alpine
    container_name: marketflow_web
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:rw,cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: marketflow_app
    environment:
      APP_ENV: dev
      PHP_DATE_TIMEZONE: Europe/Paris
    volumes:
      - ./backend:/var/www/html:rw,cached
    depends_on:
      - db
      - redis
      - rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    container_name: marketflow_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketflow}
      POSTGRES_USER: ${POSTGRES_USER:-marketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketflow} -d ${POSTGRES_DB:-marketflow}"]
      interval: 10s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: marketflow_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: marketflow_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: marketflow_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9200 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    container_name: marketflow_mailpit
    ports:
      - "8025:8025"  # UI
      - "1025:1025"  # SMTP
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8025 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  es_data: