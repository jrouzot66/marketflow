# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            Symfony\Component\Workflow\WorkflowInterface $offerPublication: '@state_machine.offer_publication'
    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Application\Offer\Port\OfferRepositoryInterface: '@App\Infrastructure\Doctrine\Repository\DoctrineOfferRepository'

    # Elasticsearch Client
    Elastic\Elasticsearch\Client:
        factory: [ 'App\Infrastructure\Search\ElasticsearchClientFactory', 'create' ]

    # Infrastructure Search services
    App\Infrastructure\Search\ElasticsearchClient:
        arguments:
            - '@Elastic\Elasticsearch\Client'
            - '@logger'
        public: false

    App\Application\Offer\CreateOffer:
        arguments:
            - '@App\Application\Tenant\TenantContext'
            - '@App\Application\Offer\Port\OfferRepositoryInterface'
            - '@event_dispatcher'
            - '@logger'
        public: false

    App\Infrastructure\Search\OfferIndexer:
        arguments:
            - '@App\Infrastructure\Search\ElasticsearchClient'
            - '@logger'
        public: false

    App\Infrastructure\Search\SearchOfferRepository:
        arguments:
            - '@App\Infrastructure\Search\ElasticsearchClient'
            - '@logger'
        public: false

    App\Application\Offer\SearchOffers:
        arguments:
            - '@App\Infrastructure\Search\SearchOfferRepository'
            - '@App\Application\Tenant\TenantContext'
        public: false

    App\Infrastructure\Messenger\Handler\IndexOfferHandler:
        tags:
            - { name: 'messenger.message_handler' }
        public: false

    App\Infrastructure\Messenger\EventSubscriber\OfferEventSubscriber:
        tags:
            -   name: 'kernel.event_listener'
                event: 'App\Domain\Offer\Event\OfferCreated'
                method: 'onOfferCreated'
                priority: 0
        public: false

    App\Interface\Http\Controller\OfferSearchController:
        tags:
            - { name: 'controller.service_arguments' }
        public: false
